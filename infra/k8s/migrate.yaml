# Database migrations, once per deploy (15 §2.11): with several api replicas starting at once,
# migrating on startup (MIGRATE_ON_START, off in production) would race. A Job's pod template
# can't be changed after creation, so `npm run k8s:up` deletes the previous run before applying.
# The init container waits until the replica set has a primary (no depends_on in Kubernetes);
# `hello` needs no login. The app user itself is created by mongo-init.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: straight-salon
  labels: { app.kubernetes.io/name: migrate, app.kubernetes.io/part-of: straight-salon }
spec:
  backoffLimit: 3
  template:
    metadata:
      labels: { app.kubernetes.io/name: migrate, app.kubernetes.io/part-of: straight-salon }
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-mongo
          image: mongo:8.2
          command:
            - sh
            - -c
            - >
              until mongosh --quiet --host mongo-0.mongo.straight-salon.svc.cluster.local:27017
              --eval 'quit(db.hello().primary ? 0 : 1)'; do
              echo "waiting for the replica set to elect a primary"; sleep 3; done
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
      containers:
        - name: migrate
          image: ghcr.io/vaikashmb/straight-salon-backend
          command: ['node', 'dist/db/runMigrations.js']
          envFrom:
            - configMapRef: { name: backend-config }
            - secretRef: { name: backend-secrets }
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: '1', memory: 512Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
