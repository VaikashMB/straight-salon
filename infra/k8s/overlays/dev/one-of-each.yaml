# One api pod and one frontend pod. Without the autoscaler (deleted below), the Rollout's
# own `replicas` decides again. The release strategies stay: a canary of one pod next to one,
# a blue-green of one and one.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: backend
spec:
  replicas: 1
---
$patch: delete
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: frontend
spec:
  replicas: 1
