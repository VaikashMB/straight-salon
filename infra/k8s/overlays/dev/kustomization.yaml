# Dev (17 §3.2): https://dev.salon.localhost, the first place a new build runs. Smaller than
# prod on purpose (one Mongo member, one pod per app, no backups, debug logs), so it's cheap to
# keep running next to the others and to throw away (`npm run k8s:down -- --env dev`).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: straight-salon-dev
resources:
  - namespace.yaml
  - ../../base
# Which build runs here, by digest (14 §2.2). Dev is where new builds enter: changed by
# `npm run k8s:up -- --env dev --latest` (what `main` points at in GHCR, signature checked)
# and committed: the deployed version is a decision recorded in git. From here a build moves
# on with `npm run k8s:promote -- dev staging`.
images:
  - name: ghcr.io/vaikashmb/straight-salon-backend
    digest: sha256:603da087cf483640425c04081cb5f6b9ba36e8a61ec885b7bf6b42767931bf12
  - name: ghcr.io/vaikashmb/straight-salon-frontend
    digest: sha256:7138c54b7717fff6a1e10e2657328616fcb7343bdcfdf7b190c1e3220f73768f
# The environment's addresses: its hostname on the shared Gateway.
configMapGenerator:
  - name: backend-config
    behavior: merge
    literals:
      - APP_BASE_URL=https://dev.salon.localhost
      - UPLOADS_PUBLIC_URL=https://dev.salon.localhost/uploads
      - LOG_LEVEL=debug
patches:
  - target: { kind: HTTPRoute, name: salon }
    patch: |
      - op: replace
        path: /spec/hostnames
        value: [dev.salon.localhost]
  # Smaller than prod (17 §3.2). Each patch is a deliberate difference; k8s:check lists them.
  - path: single-mongo.yaml
  - path: one-of-each.yaml
  - path: no-backups.yaml
