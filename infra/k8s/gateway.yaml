# Traffic in from the browser (15 §2.5, §3.3), with the Gateway API and Envoy Gateway.
# ingress-nginx, the usual Ingress controller, was retired by the Kubernetes project in
# March 2026; the Gateway API is its successor.
#
#   GatewayClass  (platform team)  which implementation runs gateways: Envoy Gateway
#   Gateway       (platform team)  listen on 80/443 for salon.localhost, with this certificate
#   HTTPRoute     (app team)       which paths go to which Service
#
# How a request arrives: 127.0.0.1:443 → kind node port 30443 (kind-config.yaml) → the Envoy
# Service (NodePort, set below) → an Envoy pod → the frontend or backend Service.

# Envoy Gateway runs one Envoy deployment per Gateway. On a cloud cluster its Service would
# be a LoadBalancer with a public address; kind has no load balancer, so it's a NodePort on
# the fixed ports kind-config.yaml maps from the host.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: salon-proxy
  namespace: straight-salon
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: NodePort
        # Envoy Gateway's default is Local: only nodes running an Envoy pod answer, which keeps
        # the client's IP but would drop traffic arriving on the control-plane node, where kind
        # maps the host ports. Cluster: any node accepts and forwards (client IP not kept).
        externalTrafficPolicy: Cluster
        patch:
          type: StrategicMerge
          value:
            spec:
              ports:
                - port: 80
                  nodePort: 30080
                - port: 443
                  nodePort: 30443
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: salon
  namespace: straight-salon
spec:
  gatewayClassName: envoy
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: salon-proxy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: salon.localhost
    - name: https
      protocol: HTTPS
      port: 443
      hostname: salon.localhost
      tls:
        mode: Terminate # TLS ends at Envoy; traffic inside the cluster is plain HTTP
        certificateRefs:
          - name: salon-tls # issued by cert-manager (certificates.yaml)
---
# Plain HTTP only redirects to HTTPS.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: salon-redirect
  namespace: straight-salon
spec:
  parentRefs:
    - name: salon
      sectionName: http
  hostnames: [salon.localhost]
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
# The app's routes. /api/* needs no rule: the frontend forwards it to the backend itself, so
# the API stays same-origin (no CORS). Uploaded images are read straight from object storage:
# /uploads/<key> is the S3 path of <key> in the public bucket `uploads` (16 §3.3).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: salon
  namespace: straight-salon
spec:
  parentRefs:
    - name: salon
      sectionName: https
  hostnames: [salon.localhost]
  rules:
    - matches:
        - path: { type: PathPrefix, value: /uploads }
      backendRefs:
        - name: seaweedfs
          port: 8333
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: frontend
          port: 3000
