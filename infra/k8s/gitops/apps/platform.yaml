# What every environment shares (17 §3.3): the Gateway with a listener per hostname, and the
# certificates. After the add-ons, which bring the Gateway and Certificate kinds.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform
  labels: { straight-salon/source: git }
  annotations: { argocd.argoproj.io/sync-wave: '-1' }
spec:
  project: platform
  source:
    repoURL: https://github.com/VaikashMB/straight-salon.git
    targetRevision: main
    path: infra/k8s/platform
  destination: { server: https://kubernetes.default.svc, namespace: straight-salon-gateway }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [ServerSideApply=true]
---
# Argo CD's own settings (argocd/): projects, repositories, the UI's route. Argo CD managing its
# own configuration means a settings change is reviewed and recorded like any other. Never
# pruned: deleting argocd-cm because a file moved would break Argo CD itself.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-config
  labels: { straight-salon/source: git }
  annotations: { argocd.argoproj.io/sync-wave: '-1' }
spec:
  project: platform
  source:
    repoURL: https://github.com/VaikashMB/straight-salon.git
    targetRevision: main
    path: infra/k8s/argocd
  destination: { server: https://kubernetes.default.svc, namespace: argocd }
  syncPolicy:
    automated: { prune: false, selfHeal: true }
    syncOptions: [ServerSideApply=true]
