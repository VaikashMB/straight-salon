# HTTPS for https://salon.localhost, the other environments' hosts and Argo CD's UI (15 §2.6,
# 17 §3.3, 18 §3.2): the backend's refresh cookie is `Secure` in production, and browsers only
# send Secure cookies over HTTPS.
#
# cert-manager makes a tiny private certificate authority, the way a client's internal CA
# would work: a self-signed issuer creates the CA certificate (in cert-manager's namespace,
# where ClusterIssuers read their secrets), a CA issuer signs salon.localhost with it.
# Browsers don't trust this CA until you add it (README, "Trust the local CA").
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: salon-local-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: Straight Salon local CA
  secretName: salon-local-ca
  duration: 8760h # one year
  privateKey: { algorithm: ECDSA, size: 256 }
  issuerRef: { kind: ClusterIssuer, name: selfsigned, group: cert-manager.io }
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: salon-local-ca
spec:
  ca:
    secretName: salon-local-ca
---
# The site certificate, one for every environment's hostname (the Gateway's listeners). It
# lives next to the Gateway, which reads it. cert-manager renews it before it expires (default:
# 90 days, renewed at two thirds); the Gateway picks up the new secret by itself.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: salon-tls
  namespace: straight-salon-gateway
spec:
  secretName: salon-tls
  dnsNames: [salon.localhost, staging.salon.localhost, dev.salon.localhost, argocd.salon.localhost]
  privateKey: { algorithm: ECDSA, size: 256 }
  issuerRef: { kind: ClusterIssuer, name: salon-local-ca, group: cert-manager.io }
