# Traffic in from the browser (15 §2.5, §3.3), with the Gateway API and Envoy Gateway.
# ingress-nginx, the usual Ingress controller, was retired by the Kubernetes project in
# March 2026; the Gateway API is its successor.
#
#   GatewayClass  (platform team)  which implementation runs gateways: Envoy Gateway
#   Gateway       (platform team)  listen on 80/443, which hostname may be claimed by which
#                                  namespace, with which certificate
#   HTTPRoute     (app team)       which paths go to which Service (base/routes.yaml, one per
#                                  environment, in the environment's namespace)
#
# One Gateway for every environment (17 §3.3): kind maps host ports 80/443 to one pair of
# NodePorts, and a NodePort can belong to only one Service in the whole cluster.
#
# How a request arrives: 127.0.0.1:443 → kind node port 30443 (kind-config.yaml) → the Envoy
# Service (NodePort, set below) → an Envoy pod → by hostname, the environment's HTTPRoute → the
# frontend Service in that environment's namespace.

# Envoy Gateway runs one Envoy deployment per Gateway. On a cloud cluster its Service would
# be a LoadBalancer with a public address; kind has no load balancer, so it's a NodePort on
# the fixed ports kind-config.yaml maps from the host.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: salon-proxy
  namespace: straight-salon-gateway
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: NodePort
        # Envoy Gateway's default is Local: only nodes running an Envoy pod answer, which keeps
        # the client's IP but would drop traffic arriving on the control-plane node, where kind
        # maps the host ports. Cluster: any node accepts and forwards (client IP not kept).
        externalTrafficPolicy: Cluster
        patch:
          type: StrategicMerge
          value:
            spec:
              ports:
                - port: 80
                  nodePort: 30080
                - port: 443
                  nodePort: 30443
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
# One HTTPS listener per environment. `allowedRoutes` names the one namespace that may attach
# routes to it (the label kubernetes.io/metadata.name is set by Kubernetes itself), so a route
# in the dev namespace can't claim salon.localhost, even by mistake: the hostname-to-namespace
# map is the platform's decision, not each app's. Adding an environment means adding a
# listener here and a name to the certificate (certificates.yaml).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: salon
  namespace: straight-salon-gateway
spec:
  gatewayClassName: envoy
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: salon-proxy
  listeners:
    # Plain HTTP for every hostname; only the redirect below (same namespace) attaches to it.
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces: { from: Same }
    - name: https-prod
      protocol: HTTPS
      port: 443
      hostname: salon.localhost
      tls:
        mode: Terminate # TLS ends at Envoy; traffic inside the cluster is plain HTTP
        certificateRefs:
          - name: salon-tls # issued by cert-manager (certificates.yaml)
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels: { kubernetes.io/metadata.name: straight-salon }
    - name: https-staging
      protocol: HTTPS
      port: 443
      hostname: staging.salon.localhost
      tls:
        mode: Terminate
        certificateRefs: [{ name: salon-tls }]
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels: { kubernetes.io/metadata.name: straight-salon-staging }
    - name: https-dev
      protocol: HTTPS
      port: 443
      hostname: dev.salon.localhost
      tls:
        mode: Terminate
        certificateRefs: [{ name: salon-tls }]
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels: { kubernetes.io/metadata.name: straight-salon-dev }
---
# Plain HTTP only redirects to HTTPS, for every hostname.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: salon-redirect
  namespace: straight-salon-gateway
spec:
  parentRefs:
    - name: salon
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
