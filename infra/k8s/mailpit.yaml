# Catches every email the worker sends (09 §8). Its web UI isn't exposed through the Gateway:
# open it with `kubectl -n straight-salon port-forward svc/mailpit 8025` (README).
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  namespace: straight-salon
  labels: { app.kubernetes.io/name: mailpit, app.kubernetes.io/part-of: straight-salon }
spec:
  selector: { app.kubernetes.io/name: mailpit }
  ports:
    - name: smtp
      port: 1025
    - name: http
      port: 8025
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  namespace: straight-salon
  labels: { app.kubernetes.io/name: mailpit, app.kubernetes.io/part-of: straight-salon }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: mailpit }
  template:
    metadata:
      labels: { app.kubernetes.io/name: mailpit, app.kubernetes.io/part-of: straight-salon }
    spec:
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.31
          ports:
            - name: smtp
              containerPort: 1025
            - name: http
              containerPort: 8025
          readinessProbe:
            httpGet: { path: /readyz, port: http }
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 500m, memory: 128Mi }
