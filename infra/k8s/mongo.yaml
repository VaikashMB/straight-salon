# MongoDB as a single-member replica set (transactions need a replica set, 02 §1), the simplest
# workable way for learning (15 §2.12). Not production: one pod, no auth, no backups (step 3).
#
# A StatefulSet gives the pod a stable name (mongo-0) and its own volume across restarts. The
# headless Service (clusterIP: None) gives each pod a DNS name,
# mongo-0.mongo.straight-salon.svc.cluster.local, which the replica set advertises.
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: straight-salon
  labels: { app.kubernetes.io/name: mongo, app.kubernetes.io/part-of: straight-salon }
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: mongo }
  ports:
    - name: mongo
      port: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  namespace: straight-salon
  labels: { app.kubernetes.io/name: mongo, app.kubernetes.io/part-of: straight-salon }
spec:
  serviceName: mongo
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: mongo }
  template:
    metadata:
      labels: { app.kubernetes.io/name: mongo, app.kubernetes.io/part-of: straight-salon }
    spec:
      containers:
        - name: mongo
          image: mongo:8.2 # same as docker-compose.yml (see its comment on 8.2)
          args: ['--replSet', 'rs0', '--bind_ip_all']
          ports:
            - name: mongo
              containerPort: 27017
          readinessProbe:
            exec:
              command: ['mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: '1', memory: 1Gi }
          volumeMounts:
            - name: data
              mountPath: /data/db
  # One PersistentVolumeClaim per pod, created from this template and kept when the pod goes.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 2Gi }
---
# Initiates the replica set (Compose's mongo-init). Kubernetes has no depends_on (15 §2.11): the
# Job simply fails while mongo-0 isn't answering yet and is retried (backoffLimit) until it is.
# The script is infra/docker/mongo-init.js, shared with Compose; `npm run k8s:up` loads it into
# the ConfigMap `mongo-init`. It's idempotent, so re-running it is harmless.
apiVersion: batch/v1
kind: Job
metadata:
  name: mongo-init
  namespace: straight-salon
  labels: { app.kubernetes.io/name: mongo-init, app.kubernetes.io/part-of: straight-salon }
spec:
  backoffLimit: 20
  template:
    metadata:
      labels: { app.kubernetes.io/name: mongo-init, app.kubernetes.io/part-of: straight-salon }
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mongo-init
          image: mongo:8.2
          command:
            - mongosh
            - --quiet
            - --host
            - mongo-0.mongo.straight-salon.svc.cluster.local:27017
            - --file
            - /scripts/mongo-init.js
          env:
            - name: MONGO_RS_HOST
              value: mongo-0.mongo.straight-salon.svc.cluster.local:27017
            - name: MONGO_DB_NAME
              value: straight_salon
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: mongo-init
