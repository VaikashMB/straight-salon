# MongoDB: a three-member replica set with authentication (16 §2.3–2.5, §3.2). Still built by
# hand (an operator would do this for you, 16 §2.9), so every moving part is visible here.
#
# - Three members on three different nodes (required anti-affinity), so losing a node leaves a
#   majority (2 of 3) that can elect a primary.
# - A PodDisruptionBudget stops planned maintenance (node drains) from taking two at once.
# - Members authenticate to each other with a shared keyFile; clients need a user and password.
#   All secrets live in the Secret `mongo-auth`, generated by `npm run k8s:up`.
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: straight-salon
  labels: { app.kubernetes.io/name: mongo, app.kubernetes.io/part-of: straight-salon }
spec:
  clusterIP: None # headless: one DNS name per member, mongo-N.mongo.straight-salon.svc.cluster.local
  publishNotReadyAddresses: true # members must find each other before they're "ready"
  selector: { app.kubernetes.io/name: mongo }
  ports:
    - name: mongo
      port: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  namespace: straight-salon
  labels: { app.kubernetes.io/name: mongo, app.kubernetes.io/part-of: straight-salon }
spec:
  serviceName: mongo
  replicas: 3
  podManagementPolicy: Parallel # start all three at once; the init Job forms the set
  selector:
    matchLabels: { app.kubernetes.io/name: mongo }
  template:
    metadata:
      labels: { app.kubernetes.io/name: mongo, app.kubernetes.io/part-of: straight-salon }
    spec:
      affinity:
        podAntiAffinity:
          # Never two members on one node (16 §2.4). With fewer free nodes than members, the
          # extra member stays Pending rather than doubling up.
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: { app.kubernetes.io/name: mongo }
              topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 30
      containers:
        - name: mongo
          image: mongo:8.2 # same as docker-compose.yml (see its comment on 8.2)
          command:
            - bash
            - -c
            - |
              set -e
              # mongod refuses a keyFile readable by anyone but its owner; a Secret volume can't
              # be mounted that way, so copy it into place with the right owner and mode.
              install -m 400 -o 999 -g 999 /etc/mongo-auth/keyfile /data/configdb/keyfile
              # Only mongo-0 creates the root user (the image does it on first start). The others
              # must start empty: they copy everything, users included, from the primary.
              if [ "${HOSTNAME##*-}" = "0" ]; then
                export MONGO_INITDB_ROOT_USERNAME=root
                export MONGO_INITDB_ROOT_PASSWORD="$(cat /etc/mongo-auth/root-password)"
              fi
              exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all \
                --keyFile /data/configdb/keyfile
          ports:
            - name: mongo
              containerPort: 27017
          # `ping` needs no login, so the probe doesn't need credentials.
          readinessProbe:
            exec:
              command: ['mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: '1', memory: 1Gi }
          volumeMounts:
            - name: data
              mountPath: /data/db
            - name: configdb
              mountPath: /data/configdb
            - name: auth
              mountPath: /etc/mongo-auth
              readOnly: true
      volumes:
        - name: configdb
          emptyDir: {}
        - name: auth
          secret:
            secretName: mongo-auth
            items:
              - { key: keyfile, path: keyfile }
              - { key: root-password, path: root-password }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 2Gi }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mongo
  namespace: straight-salon
spec:
  minAvailable: 2 # a drain may take one member at a time, never the majority
  selector:
    matchLabels: { app.kubernetes.io/name: mongo }
---
# Forms the replica set from the three members and creates the users (infra/docker/mongo-init.js,
# shared with Compose; loaded into the ConfigMap `mongo-init` by `npm run k8s:up`). Connects to
# mongo-0 as root. Kubernetes has no depends_on (15 §2.11): until mongo-0 answers, the Job fails
# and is retried. Idempotent: re-running it changes nothing.
apiVersion: batch/v1
kind: Job
metadata:
  name: mongo-init
  namespace: straight-salon
  labels: { app.kubernetes.io/name: mongo-init, app.kubernetes.io/part-of: straight-salon }
spec:
  backoffLimit: 30
  template:
    metadata:
      labels: { app.kubernetes.io/name: mongo-init, app.kubernetes.io/part-of: straight-salon }
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mongo-init
          image: mongo:8.2
          command:
            - bash
            - -c
            - >
              exec mongosh --quiet --host mongo-0.mongo.straight-salon.svc.cluster.local:27017
              --username root --password "$MONGO_ROOT_PASSWORD" --authenticationDatabase admin
              --file /scripts/mongo-init.js
          env:
            - name: MONGO_AUTH
              value: 'true'
            - name: MONGO_DB_NAME
              value: straight_salon
            - name: MONGO_RS_MEMBERS
              value: mongo-0.mongo.straight-salon.svc.cluster.local:27017,mongo-1.mongo.straight-salon.svc.cluster.local:27017,mongo-2.mongo.straight-salon.svc.cluster.local:27017
            - name: MONGO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: mongo-auth, key: root-password } }
            - name: MONGO_APP_PASSWORD
              valueFrom: { secretKeyRef: { name: mongo-auth, key: app-password } }
            - name: MONGO_BACKUP_PASSWORD
              valueFrom: { secretKeyRef: { name: mongo-auth, key: backup-password } }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: mongo-init
