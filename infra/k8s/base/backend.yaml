# The API (15 §3.2). Image by digest: each overlay's kustomization.yaml fills in the digest.
#
# Released as a canary (18 §2.5, §3.5) by Argo Rollouts: a Rollout is a Deployment with a
# release strategy. A new version first gets one pod next to the stable ones (about half the
# traffic with two stable pods, since the Service `backend` selects both), the http-check
# analysis asks the canary pods directly through `backend-canary`, then a pause, then the
# rest. A failed analysis aborts: the canary is scaled away and stable keeps serving.
#
# Probes (15 §2.8): startup and liveness ask /health/live (process up, no dependency checks),
# readiness asks /health/ready (503 while Mongo is down or while shutting down). A liveness
# probe that checked Mongo would restart every api pod during a database blip.
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels: { app.kubernetes.io/name: backend, app.kubernetes.io/part-of: straight-salon }
spec:
  selector: { app.kubernetes.io/name: backend }
  ports:
    - name: http
      port: 4000
      targetPort: http
---
# Only the canary's pods: Argo Rollouts adds their pod-template-hash to this selector while a
# release is in progress, so the analysis talks to the new version and nothing else.
apiVersion: v1
kind: Service
metadata:
  name: backend-canary
  labels: { app.kubernetes.io/name: backend, app.kubernetes.io/part-of: straight-salon }
spec:
  selector: { app.kubernetes.io/name: backend }
  ports:
    - name: http
      port: 4000
      targetPort: http
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: backend
  labels: { app.kubernetes.io/name: backend, app.kubernetes.io/part-of: straight-salon }
  annotations:
    # After the migration (wave 2): new code never starts against an old schema.
    argocd.argoproj.io/sync-wave: '3'
spec:
  # No `replicas:` here: the HorizontalPodAutoscaler below owns the count. Setting it would
  # reset the HPA's choice on every apply.
  revisionHistoryLimit: 5
  strategy:
    canary:
      canaryService: backend-canary
      maxUnavailable: 0 # never drop below the current count during a release
      maxSurge: 1
      steps:
        - setWeight: 50 # one canary pod next to the stable ones
        - analysis:
            templates: [{ templateName: http-check }]
            args:
              - name: urls
                value: http://backend-canary:4000/health/ready http://backend-canary:4000/api/v1/settings/public
        - pause: { duration: 30s } # time to look (logs, the site) before the rest of the traffic
  selector:
    matchLabels: { app.kubernetes.io/name: backend }
  template:
    metadata:
      labels: { app.kubernetes.io/name: backend, app.kubernetes.io/part-of: straight-salon }
    spec:
      # SIGTERM → readiness turns 503 and in-flight requests finish (01 §6); killed after 30 s.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: backend
          image: ghcr.io/vaikashmb/straight-salon-backend
          envFrom:
            - configMapRef: { name: backend-config }
            - secretRef: { name: backend-secrets }
          ports:
            - name: http
              containerPort: 4000
          startupProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 2
            failureThreshold: 30 # up to 60 s to start before liveness takes over
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          lifecycle:
            # Removal from the Service and SIGTERM happen at the same time; routing needs a
            # moment to notice. Keep serving for 5 s first (15 §2.9).
            preStop:
              sleep: { seconds: 5 }
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: '1', memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      # No uploads volume any more: images go to object storage (16 §3.3), so api pods can run
      # on any node, and the scheduler spreads them.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: backend }
      volumes:
        - name: tmp
          emptyDir: {}
---
# Keeps average CPU near 70 % of the pods' requests by adding or removing api pods (15 §2.10).
# Reads CPU from metrics-server.
#
# Same sync wave as the Rollout it scales. In an earlier wave it's unhealthy until its target
# exists ("unable to get the target's current scale"), and that wave never finishes, so the
# Rollout's wave never starts (18 §2.10).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
  labels: { app.kubernetes.io/name: backend, app.kubernetes.io/part-of: straight-salon }
  annotations:
    argocd.argoproj.io/sync-wave: '3'
spec:
  scaleTargetRef:
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    name: backend
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
