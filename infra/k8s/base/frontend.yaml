# The Next.js frontend. It forwards /api/* to the backend Service inside the cluster (05 §5),
# so the browser only ever talks to the environment's own hostname.
#
# Released blue-green (18 §2.5, §3.5) by Argo Rollouts: a complete second set of pods starts
# with the new version behind `frontend-preview`, the http-check analysis asks those, and only
# then does `frontend` (what the Gateway sends visitors to) switch over, all at once. The old
# pods stay up for a minute afterwards, so going back is a switch, not a redeploy.
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels: { app.kubernetes.io/name: frontend, app.kubernetes.io/part-of: straight-salon }
spec:
  selector: { app.kubernetes.io/name: frontend }
  ports:
    - name: http
      port: 3000
      targetPort: http
---
# The new version's pods during a release (Argo Rollouts sets the selector's pod-template-hash).
# Not on the Gateway: only the analysis, and you with a port-forward, look at it.
apiVersion: v1
kind: Service
metadata:
  name: frontend-preview
  labels: { app.kubernetes.io/name: frontend, app.kubernetes.io/part-of: straight-salon }
spec:
  selector: { app.kubernetes.io/name: frontend }
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: frontend
  labels: { app.kubernetes.io/name: frontend, app.kubernetes.io/part-of: straight-salon }
  annotations:
    argocd.argoproj.io/sync-wave: '3'
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    blueGreen:
      activeService: frontend
      previewService: frontend-preview
      prePromotionAnalysis:
        templates: [{ templateName: http-check }]
        args:
          - name: urls
            value: http://frontend-preview:3000/
      autoPromotionEnabled: true # promote as soon as the analysis passes
      scaleDownDelaySeconds: 60 # old pods stay a minute after the switch
  selector:
    matchLabels: { app.kubernetes.io/name: frontend }
  template:
    metadata:
      labels: { app.kubernetes.io/name: frontend, app.kubernetes.io/part-of: straight-salon }
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: frontend
          image: ghcr.io/vaikashmb/straight-salon-frontend
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: '3000'
            - name: API_INTERNAL_URL
              value: http://backend:4000
          ports:
            - name: http
              containerPort: 3000
          startupProbe:
            tcpSocket: { port: http }
            periodSeconds: 2
            failureThreshold: 30
          # Liveness: is the server process answering at all? (tcp, no page rendering)
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 10
          # Readiness: can it render a page? The home page degrades gracefully when the API is
          # down (05 §6), so this doesn't take the frontend out with the backend.
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
          lifecycle:
            preStop:
              sleep: { seconds: 5 }
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: '1', memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            # Next.js writes its image and fetch caches here; everything else is read-only.
            - name: next-cache
              mountPath: /app/frontend/.next/cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: next-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
