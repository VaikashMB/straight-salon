# The Next.js frontend. It forwards /api/* to the backend Service inside the cluster (05 §5),
# so the browser only ever talks to the environment's own hostname.
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels: { app.kubernetes.io/name: frontend, app.kubernetes.io/part-of: straight-salon }
spec:
  selector: { app.kubernetes.io/name: frontend }
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels: { app.kubernetes.io/name: frontend, app.kubernetes.io/part-of: straight-salon }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app.kubernetes.io/name: frontend }
  template:
    metadata:
      labels: { app.kubernetes.io/name: frontend, app.kubernetes.io/part-of: straight-salon }
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: frontend
          image: ghcr.io/vaikashmb/straight-salon-frontend
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: '3000'
            - name: API_INTERNAL_URL
              value: http://backend:4000
          ports:
            - name: http
              containerPort: 3000
          startupProbe:
            tcpSocket: { port: http }
            periodSeconds: 2
            failureThreshold: 30
          # Liveness: is the server process answering at all? (tcp, no page rendering)
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 10
          # Readiness: can it render a page? The home page degrades gracefully when the API is
          # down (05 §6), so this doesn't take the frontend out with the backend.
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
          lifecycle:
            preStop:
              sleep: { seconds: 5 }
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: '1', memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            # Next.js writes its image and fetch caches here; everything else is read-only.
            - name: next-cache
              mountPath: /app/frontend/.next/cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: next-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
