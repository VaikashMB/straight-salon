# Object storage with an S3 API (16 §2.7, §3.3): SeaweedFS (Apache 2.0) replaces the node-local
# uploads volume. One process runs everything (master, volume server, filer, S3 gateway).
# Credentials and the access rules (anonymous read on `uploads` only) are the file s3.json in
# the Secret `seaweedfs-s3`, generated by `npm run k8s:up`.
#
# A single pod: while it's down, new uploads and backups fail; bookings don't (16 §8).
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  labels: { app.kubernetes.io/name: seaweedfs, app.kubernetes.io/part-of: straight-salon }
spec:
  selector: { app.kubernetes.io/name: seaweedfs }
  ports:
    - name: s3
      port: 8333
      targetPort: s3
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweedfs
  labels: { app.kubernetes.io/name: seaweedfs, app.kubernetes.io/part-of: straight-salon }
spec:
  serviceName: seaweedfs
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: seaweedfs }
  template:
    metadata:
      labels: { app.kubernetes.io/name: seaweedfs, app.kubernetes.io/part-of: straight-salon }
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.48
          args:
            - server
            - -dir=/data
            - -ip.bind=0.0.0.0
            - -s3
            - -s3.config=/etc/seaweedfs/s3.json
          ports:
            - name: s3
              containerPort: 8333
          readinessProbe:
            tcpSocket: { port: s3 }
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: '1', memory: 512Mi }
          volumeMounts:
            - name: data
              mountPath: /data
            - name: s3-config
              mountPath: /etc/seaweedfs
              readOnly: true
      volumes:
        - name: s3-config
          secret:
            secretName: seaweedfs-s3
            items:
              - { key: s3.json, path: s3.json }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 5Gi }
---
# Creates the two buckets: `uploads` (public read, set in s3.json) and `backups` (private).
# rclone reads its whole configuration from RCLONE_CONFIG_S3_* variables, so no config file.
# A sync hook like mongo-init (18 §2.6): idempotent, re-run on every sync, before the app starts.
apiVersion: batch/v1
kind: Job
metadata:
  name: buckets
  labels: { app.kubernetes.io/name: buckets, app.kubernetes.io/part-of: straight-salon }
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: '1'
spec:
  backoffLimit: 20
  template:
    metadata:
      labels: { app.kubernetes.io/name: buckets, app.kubernetes.io/part-of: straight-salon }
    spec:
      restartPolicy: OnFailure
      containers:
        - name: buckets
          image: rclone/rclone:1.75.1
          command:
            ['sh', '-c', 'rclone mkdir s3:uploads && rclone mkdir s3:backups && rclone lsd s3:']
          envFrom:
            - secretRef: { name: rclone-s3 }
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 250m, memory: 128Mi }
