# The app as every environment runs it (17 §3.1). Never applied on its own: an overlay
# (overlays/dev, staging, prod) adds the namespace, the hostname, the image digests and its own
# differences. The base is prod-shaped (three Mongo members, autoscaled api, backups); dev
# shrinks it, staging and prod keep it (17 §2.4).
#
# No `namespace:` anywhere in here, and no image digests: both are the environment's decision.
#
# Argo CD applies it (18 §3.3), in sync waves: data stores (wave 0), then the Jobs that prepare
# them (wave 1: replica set and users, buckets), then migrations (wave 2), then the code that
# depends on all of that (wave 3). The waves are annotations on the objects themselves.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - mongo.yaml
  - redis.yaml
  - mailpit.yaml
  - seaweedfs.yaml
  - backup.yaml
  - migrate.yaml
  - analysis.yaml
  - backend.yaml
  - worker.yaml
  - frontend.yaml
  - routes.yaml
# Kustomize rewrites references to generated ConfigMaps only in kinds it knows. A Rollout is a
# custom resource, so without this it would keep asking for `backend-config` (no hash), which
# doesn't exist (18 §2.10).
configurations:
  - rollout-transform.yaml
# Generated ConfigMaps get a new name whenever their content changes (17 §2.6). Argo CD would
# prune the old one at the next sync, but a ReplicaSet we might still go back to (an aborted
# canary, a blue-green rollback) needs it to start pods. So Argo CD keeps them (Prune=false) and
# doesn't count the leftovers as drift (IgnoreExtraneous) (18 §2.8).
generatorOptions:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
    argocd.argoproj.io/compare-options: IgnoreExtraneous
# Non-secret backend settings (15 §2.7, §3.4): what docker-compose.yml's x-backend-env sets,
# with in-cluster names. Overlays add the environment's addresses (APP_BASE_URL,
# UPLOADS_PUBLIC_URL) and may override any of these. Secrets (JWT_ACCESS_SECRET,
# OUTBOX_ENCRYPTION_KEY, MONGO_URI with its password, the S3 keys) are in the Secret
# `backend-secrets`, generated per environment by `npm run k8s:up` and never committed.
#
# Generated, so its name gets a hash of its content (backend-config-<hash>), and Kustomize
# rewrites every reference to it. A config change is a new name, so the pods that use it roll
# out again; with a fixed name, they'd keep the old values until something restarted them
# (17 §2.6).
configMapGenerator:
  - name: backend-config
    literals:
      - NODE_ENV=production
      - PORT=4000
      - LOG_LEVEL=info
      - LOG_PRETTY=false
      - REDIS_URL=redis://redis:6379
      - STORAGE_DRIVER=s3
      - S3_ENDPOINT=http://seaweedfs:8333
      - S3_BUCKET=uploads
      - S3_REGION=us-east-1
      - EMAIL_PROVIDER=smtp
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
  # The script that forms the replica set and creates the users, shared with Compose. It lives
  # outside this folder, so rendering needs `--load-restrictor LoadRestrictionsNone`
  # (scripts/k8s-manifests.mjs, and Argo CD's kustomize.buildOptions in argocd/argocd-cm.yaml).
  - name: mongo-init
    files:
      - mongo-init.js=../../docker/mongo-init.js
