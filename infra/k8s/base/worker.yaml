# Queue consumers, scheduled jobs and the outbox relay (RUN_RELAY_IN_WORKER): the backend image
# with another command (01 §1). One replica: several relays at once aren't designed for (15 §3.2).
# No HTTP server, so no HTTP probes; Kubernetes restarts it if the process exits (15 §2.8).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels: { app.kubernetes.io/name: worker, app.kubernetes.io/part-of: straight-salon }
spec:
  replicas: 1
  # Recreate, not RollingUpdate: never two workers (two relays) at the same time.
  strategy:
    type: Recreate
  selector:
    matchLabels: { app.kubernetes.io/name: worker }
  template:
    metadata:
      labels: { app.kubernetes.io/name: worker, app.kubernetes.io/part-of: straight-salon }
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: worker
          image: ghcr.io/vaikashmb/straight-salon-backend
          command: ['node', 'dist/worker.js']
          envFrom:
            - configMapRef: { name: backend-config }
            - secretRef: { name: backend-secrets }
          resources:
            requests: { cpu: 50m, memory: 192Mi }
            limits: { cpu: '1', memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
