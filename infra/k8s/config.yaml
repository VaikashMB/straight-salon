# Non-secret backend settings (15 §2.7, §3.4): what docker-compose.yml's x-backend-env sets,
# with in-cluster names. Secrets (JWT_ACCESS_SECRET, OUTBOX_ENCRYPTION_KEY) are in the Secret
# `backend-secrets`, generated by `npm run k8s:up` and never committed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: straight-salon
data:
  NODE_ENV: production
  PORT: '4000'
  LOG_PRETTY: 'false'
  # The replica-set member's stable StatefulSet name (mongo-0 via the headless Service `mongo`).
  MONGO_URI: mongodb://mongo-0.mongo.straight-salon.svc.cluster.local:27017/straight_salon?replicaSet=rs0
  REDIS_URL: redis://redis:6379
  # Browser-facing addresses, through the Gateway (gateway.yaml).
  APP_BASE_URL: https://salon.localhost
  UPLOADS_PUBLIC_URL: https://salon.localhost/uploads
  UPLOADS_DIR: /app/backend/uploads
  EMAIL_PROVIDER: smtp
  SMTP_HOST: mailpit
  SMTP_PORT: '1025'
