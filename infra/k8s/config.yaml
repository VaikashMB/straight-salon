# Non-secret backend settings (15 §2.7, §3.4): what docker-compose.yml's x-backend-env sets,
# with in-cluster names. Secrets (JWT_ACCESS_SECRET, OUTBOX_ENCRYPTION_KEY, MONGO_URI with its
# password, the S3 keys) are in the Secret `backend-secrets`, generated by `npm run k8s:up` and
# never committed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: straight-salon
data:
  NODE_ENV: production
  PORT: '4000'
  LOG_PRETTY: 'false'
  REDIS_URL: redis://redis:6379
  # Browser-facing addresses, through the Gateway (gateway.yaml).
  APP_BASE_URL: https://salon.localhost
  # Uploads go to SeaweedFS (16 §3.3); browsers read them through the Gateway's /uploads route.
  UPLOADS_PUBLIC_URL: https://salon.localhost/uploads
  STORAGE_DRIVER: s3
  S3_ENDPOINT: http://seaweedfs:8333
  S3_BUCKET: uploads
  S3_REGION: us-east-1
  EMAIL_PROVIDER: smtp
  SMTP_HOST: mailpit
  SMTP_PORT: '1025'
