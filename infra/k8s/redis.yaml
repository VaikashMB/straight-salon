# Redis, one pod with append-only persistence (16 §2.8). It holds the cache (harmless to lose)
# and the BullMQ job queues (not harmless: queued jobs live only here), so it keeps its data on
# a volume, but no failover: why is explained in 16 §2.8. Deliberately no PodDisruptionBudget:
# for a single pod, a budget that forbids eviction would block every node drain forever
# (upgrades, maintenance), a common anti-pattern; a drain simply restarts Redis, which keeps
# its data.
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: straight-salon
  labels: { app.kubernetes.io/name: redis, app.kubernetes.io/part-of: straight-salon }
spec:
  selector: { app.kubernetes.io/name: redis }
  ports:
    - name: redis
      port: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: straight-salon
  labels: { app.kubernetes.io/name: redis, app.kubernetes.io/part-of: straight-salon }
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: redis }
  template:
    metadata:
      labels: { app.kubernetes.io/name: redis, app.kubernetes.io/part-of: straight-salon }
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          args: ['redis-server', '--appendonly', 'yes', '--appendfsync', 'everysec']
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ['redis-cli', 'ping']
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 1Gi }
