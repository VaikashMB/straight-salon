# Redis with append-only persistence, one pod (15 §2.12; managed Redis vs in-cluster is step 3).
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: straight-salon
  labels: { app.kubernetes.io/name: redis, app.kubernetes.io/part-of: straight-salon }
spec:
  selector: { app.kubernetes.io/name: redis }
  ports:
    - name: redis
      port: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: straight-salon
  labels: { app.kubernetes.io/name: redis, app.kubernetes.io/part-of: straight-salon }
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: redis }
  template:
    metadata:
      labels: { app.kubernetes.io/name: redis, app.kubernetes.io/part-of: straight-salon }
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          args: ['redis-server', '--appendonly', 'yes']
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ['redis-cli', 'ping']
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 1Gi }
