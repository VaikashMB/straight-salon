# https://argocd.salon.localhost: Argo CD's web UI through the shared Gateway, whose
# https-argocd listener admits routes from this namespace only (platform/gateway.yaml).
# Sign in as `admin`; `npm run k8s:up` prints the command that shows the password.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
spec:
  parentRefs:
    - name: salon
      namespace: straight-salon-gateway
  hostnames: [argocd.salon.localhost]
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
