# CI pipeline (12-automation-and-ci §3). Everything a developer runs with `npm run validate`, plus
# the security scans, SonarCloud, image builds and the Playwright e2e suite.
name: CI

on:
  pull_request:
    # `labeled` so that adding the "e2e" label runs the e2e job on a PR
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Runs e2e on main, and on PRs labelled "e2e" (10 §2)
  RUN_E2E: ${{ github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'e2e') }}

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-deps

  lint:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-deps
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck

  security:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans the whole history
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: npm audit (high and above, scripts/audit-allowlist.json)
        run: npm run audit
      - name: gitleaks (accepted findings in .gitleaksignore)
        run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --no-banner

  test-backend:
    needs: setup
    runs-on: ubuntu-latest
    services:
      # BullMQ adapter and Redis 7 semantics tests (10 §2); Mongo is mongodb-memory-server
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-deps
      - name: Cache the mongod binary (downloaded on first test use, 10 §3)
        uses: actions/cache@v6
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # S3 adapter integration test (16 §3.4). A step, not a service container: services can't
      # take the arguments SeaweedFS needs.
      - name: Start SeaweedFS (S3)
        run: |
          printf '%s' '{"identities":[{"name":"ci","credentials":[{"accessKey":"testkey","secretKey":"testsecret"}],"actions":["Admin","Read","Write","List"]},{"name":"anonymous","actions":["Read:uploads"]}]}' > "$RUNNER_TEMP/s3.json"
          docker run -d --name seaweedfs -p 127.0.0.1:8333:8333 -v "$RUNNER_TEMP/s3.json:/etc/s3.json:ro" \
            chrislusf/seaweedfs:4.48 server -s3 -s3.config=/etc/s3.json -dir=/data
          for _ in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:8333/ && exit 0; sleep 1; done
          docker logs seaweedfs; exit 1
      - run: npm run test:coverage -w backend
        env:
          S3_TEST_ENDPOINT: http://127.0.0.1:8333
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: |
            backend/coverage/lcov.info
            backend/coverage/cobertura-coverage.xml
            backend/reports/junit.xml
          if-no-files-found: warn

  test-frontend:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-deps
      - run: npm run test:coverage -w frontend
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: |
            frontend/coverage/lcov.info
            frontend/coverage/cobertura-coverage.xml
            frontend/reports/junit.xml
          if-no-files-found: warn

  contract:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-deps
      - name: OpenAPI and generated client match the code (04 §2)
        run: npm run contract:check

  sonar:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - if: env.SONAR_TOKEN == ''
        run: >
          echo "::notice title=SonarCloud skipped::Add the SONAR_TOKEN secret and the
          SONAR_ORGANIZATION variable to run the scan and quality gate (README, CI setup)."
      - if: env.SONAR_TOKEN != ''
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # blame and new-code detection
      - if: env.SONAR_TOKEN != ''
        uses: actions/download-artifact@v8
        with:
          name: backend-coverage
          path: backend
      - if: env.SONAR_TOKEN != ''
        uses: actions/download-artifact@v8
        with:
          name: frontend-coverage
          path: frontend
      - if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonarcloud.io' }}
        with:
          # A red quality gate fails the job (10 §5.3)
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION || github.repository_owner }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY || 'VaikashMB_straight-salon' }}
            -Dsonar.qualitygate.wait=true

  # Builds each image once (14 §3.2). On pull requests: build into the local engine and scan,
  # nothing is pushed (unreviewed code never gets registry access). On main: push the single
  # build to GHCR as sha-<commit> with SBOM and provenance, scan the pushed bytes, and sign both
  # digests once both scans pass. The `main` tag only moves later, in `promote`.
  docker-build:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push sha-<commit> images (main only)
      id-token: write # OIDC token for keyless cosign signing (14 §2.7)
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    outputs:
      backend: ${{ steps.names.outputs.backend }}@${{ steps.backend.outputs.digest }}
      frontend: ${{ steps.names.outputs.frontend }}@${{ steps.frontend.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      # Registry paths must be lowercase (VaikashMB -> vaikashmb), and workflow expressions
      # can't lowercase, so the shell does it.
      - name: Image names
        id: names
        run: |
          ns="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          echo "backend=${ns}/straight-salon-backend" >> "$GITHUB_OUTPUT"
          echo "frontend=${ns}/straight-salon-frontend" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: env.PUBLISH == 'true'
        name: Log in to GHCR with the job's own token
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Backend image (also the worker's)
        id: backend
        uses: ./.github/actions/build-scan-image
        with:
          dockerfile: backend/Dockerfile
          local-tag: straight-salon/backend:local
          cache-scope: backend
          push: ${{ env.PUBLISH }}
          image: ${{ steps.names.outputs.backend }}
      - name: Frontend image
        id: frontend
        uses: ./.github/actions/build-scan-image
        with:
          dockerfile: frontend/Dockerfile
          local-tag: straight-salon/frontend:local
          cache-scope: frontend
          push: ${{ env.PUBLISH }}
          image: ${{ steps.names.outputs.frontend }}
      # Signing means "this passed our checks": only after both scans, and always the digest.
      - if: env.PUBLISH == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6 # the release this installer checks against its own checksum
      - if: env.PUBLISH == 'true'
        name: Sign both digests (keyless)
        env:
          BACKEND: ${{ steps.names.outputs.backend }}@${{ steps.backend.outputs.digest }}
          FRONTEND: ${{ steps.names.outputs.frontend }}@${{ steps.frontend.outputs.digest }}
        run: |
          cosign sign --yes "$BACKEND"
          cosign sign --yes "$FRONTEND"
          {
            echo "### Images pushed and signed (not yet promoted to \`main\`)"
            echo
            echo "- \`$BACKEND\`"
            echo "- \`$FRONTEND\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - if: env.RUN_E2E == 'true'
        name: Save images for the e2e job
        run: docker save straight-salon/backend:local straight-salon/frontend:local | gzip > images.tar.gz
      - if: env.RUN_E2E == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: images
          path: images.tar.gz
          retention-days: 1

  e2e:
    needs: docker-build
    if: github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-deps
      - uses: actions/download-artifact@v8
        with:
          name: images
      - name: Load the images built by docker-build
        run: |
          gunzip -c images.tar.gz | docker load
          docker tag straight-salon/backend:local straight-salon/worker:local
      - name: Start the stack with seed data (12 §4)
        run: |
          npm run env:init
          # --wait fails on a service without a healthcheck, and the worker has none (no HTTP
          # server), so wait for the others (their dependencies included), then start the worker.
          docker compose -f docker-compose.yml up -d --no-build --wait backend frontend mailpit
          docker compose -f docker-compose.yml up -d --no-build worker
          npm run db:seed
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
      - if: failure()
        name: Collect container logs
        run: docker compose -f docker-compose.yml logs --no-color > compose.log
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            frontend/playwright-report
            frontend/test-results
            frontend/reports/e2e-junit.xml
            compose.log
          retention-days: 7

  # Moves the `main` tag to the digests docker-build pushed, once every check on this commit has
  # passed (14 §3.2). No rebuild: the tested bytes are the promoted bytes.
  promote:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [docker-build, lint, security, test-backend, test-frontend, contract, sonar, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote backend to main
        uses: ./.github/actions/promote-image
        with:
          source: ${{ needs.docker-build.outputs.backend }}
          tags: main
      - name: Promote frontend to main
        uses: ./.github/actions/promote-image
        with:
          source: ${{ needs.docker-build.outputs.frontend }}
          tags: main
