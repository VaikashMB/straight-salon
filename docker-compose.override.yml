# Development overrides, auto-loaded by `docker compose up` (11-docker-local-dev §3).
# Builds the `dev` stage (all dependencies), mounts source for hot reload, pretty logs.
# For production-style images only: docker compose -f docker-compose.yml up --build

services:
  backend:
    build:
      target: dev
    image: straight-salon/backend:dev
    command: ['npx', 'tsx', 'watch', '--inspect=0.0.0.0:9229', 'src/server.ts']
    environment:
      NODE_ENV: development
      LOG_PRETTY: 'true'
    volumes:
      - ./backend/src:/app/backend/src
    ports:
      - '127.0.0.1:9229:9229' # Node inspector

  worker:
    build:
      target: dev
    image: straight-salon/worker:dev
    command: ['npx', 'tsx', 'watch', 'src/worker.ts']
    environment:
      NODE_ENV: development
      LOG_PRETTY: 'true'
    volumes:
      - ./backend/src:/app/backend/src

  frontend:
    build:
      target: dev
    image: straight-salon/frontend:dev
    environment:
      NODE_ENV: development
    # `next dev` compiles routes in memory and outgrows the 512m runtime limit (OOM-killed after
    # visiting most pages); the production server stays on the base file's limit.
    deploy:
      resources:
        limits: { cpus: '2.0', memory: 2g }
    volumes:
      - ./frontend/src:/app/frontend/src
      - ./frontend/public:/app/frontend/public
